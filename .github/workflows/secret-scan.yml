name: Check for exposed secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan complete history with redacted output
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          "$RUNNER_TEMP/gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts="--all --full-history" \
            --redact=100 --ignore-gitleaks-allow \
            --max-decode-depth=3 --max-archive-depth=3 \
            --no-banner --no-color --timeout=120
